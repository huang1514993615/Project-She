<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17131e">
  <title>角色动态引擎实验室</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main class="lab-shell">
    <section class="intro">
      <p class="eyebrow">CHARACTER MOTION ENGINE · 0.1</p>
      <h1>让立绘从“换图片”变成一段表演</h1>
      <p>呼吸、眨眼和头发摆动持续运行；表情、视线和动作按照时间线组合。当前使用程序化占位角色，接入透明分层图后无需改业务代码。</p>
      <div class="status-line">
        <span id="statusDot"></span>
        <b id="statusText">等待动作</b>
      </div>
    </section>

    <section class="stage-card">
      <div id="characterStage" class="stage" aria-label="角色动画舞台"></div>
      <div class="stage-caption">
        <div>
          <small>当前状态</small>
          <b id="currentState">neutral · idle</b>
        </div>
        <button id="speakButton" type="button">模拟说话</button>
      </div>
    </section>

    <section class="control-card">
      <div>
        <p class="eyebrow">TIMELINE</p>
        <h2>连续表演</h2>
      </div>
      <div class="motion-grid">
        <button data-motion="comforted"><b>被安慰</b><small>平静 → 伤心 → 伸手 → 安心</small></button>
        <button data-motion="greeting"><b>惊喜招呼</b><small>吃惊 → 挥手 → 开心</small></button>
        <button data-sequence="guard"><b>警戒施法</b><small>正常 → 警觉 → 施法 → 放松</small></button>
      </div>

      <p class="eyebrow section-gap">CHANNELS</p>
      <div class="channel-controls">
        <label>表情
          <select id="emotionSelect">
            <option value="neutral">正常</option>
            <option value="happy">开心</option>
            <option value="sad">伤心</option>
            <option value="angry">生气</option>
            <option value="surprised">惊讶</option>
          </select>
        </label>
        <label>动作
          <select id="actionSelect">
            <option value="idle">自然站立</option>
            <option value="wave">挥手</option>
            <option value="reach">伸手</option>
            <option value="hold_hands">牵手</option>
            <option value="arms_crossed">抱臂</option>
            <option value="cast_spell">施法</option>
            <option value="hide">躲藏</option>
          </select>
        </label>
        <label>视线
          <select id="gazeSelect">
            <option value="user">看向用户</option>
            <option value="left">看向左侧</option>
            <option value="right">看向右侧</option>
            <option value="down">低头</option>
          </select>
        </label>
      </div>

      <p class="eyebrow section-gap">AI VISUAL JSON</p>
      <textarea id="visualInput" spellcheck="false"></textarea>
      <button id="playJsonButton" class="primary-action" type="button">播放模型时间线</button>
    </section>
  </main>
  <script type="module" src="./demo.js"></script>
</body>
</html>
